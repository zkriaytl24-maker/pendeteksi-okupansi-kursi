<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Deteksi Okupansi Kursi</title>

    <!-- ONNX Runtime -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            text-align: center;
        }

        .creator {
            margin-bottom: 20px;
            color: #cbd5e1;
            font-size: 1rem;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .container {
            position: relative;
            width: 640px;
            max-width: 100%;
            aspect-ratio: 4/3;
            overflow: hidden;
            border-radius: 15px;
            border: 2px solid rgba(255,255,255,0.2);
        }

        video,
        canvas#overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        canvas#overlay {
            z-index: 10;
            pointer-events: none;
        }

        #status {
            margin: 15px 0;
            padding: 12px;
            border-radius: 10px;
            background: rgba(0,0,0,0.3);
            text-align: center;
            font-weight: bold;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .btn-start {
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 15px;
        }

        .btn-start:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 75, 43, 0.5);
        }

        footer {
            margin-top: 20px;
            color: #94a3b8;
            font-size: 0.9rem;
            text-align: center;
        }

        @media (max-width: 700px) {
            h1 {
                font-size: 1.5rem;
            }

            .btn-start {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <h1>🛡️ AI Deteksi Okupansi Kursi</h1>
    <p class="creator">Dibuat oleh: <b>Zikri</b></p>

    <div class="card">

        <button id="btn-init" class="btn-start">
            📷 AKTIFKAN KAMERA
        </button>

        <div id="status">
            🔴 STATUS: NONAKTIF
        </div>

        <div class="container">
            <video id="webcam" playsinline muted autoplay></video>
            <canvas id="overlay" width="640" height="480"></canvas>
        </div>

    </div>

    <!-- Canvas Processor -->
    <canvas id="processor" width="640" height="640" style="display:none;"></canvas>

    <footer>
        Sistem AI Real-Time Detection • 2026
    </footer>

    <!-- File AI -->
    <script src="app.js"></script>

</body>
</html>
